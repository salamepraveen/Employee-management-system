server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ems_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000

jwt:
  # 
  # JWT SECRET = The cryptographic key used to sign tokens.
  # 
  # How it works:
  #   1. User logs in → auth-service creates a JWT
  #   2. JWT is signed with this secret (like a digital signature)
  #   3. When user sends JWT to another service, that service
  #      verifies the signature using this SAME secret
  # 
  # SECURITY RULES:
  #   - NEVER use this secret in production! Use environment variables.
  #   - Must be AT LEAST 256 bits (32 characters) for HS256 algorithm.
  #   - Should be random and unguessable.
  #
  secret: my-super-secret-jwt-key-that-is-at-least-256-bits-long-for-hs256-algorithm
  # 
  # Expiration time for the JWT token.
  # 86400000 ms = 24 hours.
  # After 24 hours, the user must log in again.
  #
  expiration: 86400000

app:
  # 
  # Custom property for auth-service.
  # This tells auth-service WHERE the user-service is running.
  # Used when auth-service needs to call user-service internally
  # (for example, to fetch user details during registration).
  #
  user-service-url: http://localhost:8081